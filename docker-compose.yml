services:
  # ── PostgreSQL Database ─────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: studio_bppsi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studio_bppsi
    ports:
      - "5433:5432"
    volumes:
      - studio_bppsi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studio_bppsi"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Next.js App (opsional — gunakan hanya untuk full-stack Docker) ───────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studio_bppsi_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/studio_bppsi
      ADMIN_PIN: ${ADMIN_PIN:-admin123}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-koderahasia1234567890123456789012345}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_NAME: Studio BPPSI UIKA
      NODE_ENV: production
    ports:
      - "3000:3000"
    profiles:
      - full

volumes:
  studio_bppsi_pgdata:
    name: studio_bppsi_pgdata
